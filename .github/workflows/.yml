name: 🚀 Deploy website on push

on:
  push:
    branches:
      - main # Change this if your default branch is 'master'

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4


      - name: 📂 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./htdocs/ # Optional: Specify the target folder on your server
          # local-dir: ./dist/         # Optional: Specify the local folder to upload (e.g., build/ or dist/)
