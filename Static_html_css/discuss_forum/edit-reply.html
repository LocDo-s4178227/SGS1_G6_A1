<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Edit your reply or offer on a custom-make request.">
<title>Edit Reply - Custom Makers Marketplace</title>
<link rel="stylesheet" href="../css/module-base.css">
<link rel="stylesheet" href="css/discussion_forum.css">
<link rel="stylesheet" href="../css/top-nav.css">
</head>
<body class="with-rshop-nav">
<div id="rshop-shared-nav"></div>
<main class="container-sm">
<div class="card">
<h1>Edit Your Reply</h1>
<p class="meta-info mb-1">Editing your offer on: <strong>Need a custom ergonomic wooden desk</strong></p>
<form id="edit-reply-form" class="mt-1">
<div class="form-group current-user-info" style="margin-bottom: 15px; padding: 10px; background-color: #e9ecef; border-left: 4px solid #007bff; border-radius: 4px;">
<span style="font-size: 0.9em; color: #555;">Posting as: </span>
<strong id="currentUserDisplay" style="color: #333;">Loading user...</strong>
<br>
<small style="color: #666; font-style: italic;">* Date and time will be automatically generated by the server.</small>
</div>
<div class="form-group">
<label for="edit-reply-title">Reply Title</label>
<input type="text" id="edit-reply-title" name="reply_title" required>
<span id="edit-reply-title-error" style="color: red; display: none; font-size: 0.85em; margin-top: 5px;"></span>
</div>
<div class="form-group">
<label for="edit-reply-content">Reply Content</label>
<textarea id="edit-reply-content" name="reply_content" rows="4" required></textarea>
<span id="edit-reply-content-error" style="color: red; display: none; font-size: 0.85em; margin-top: 5px;"></span>
</div>
<div class="form-group">
<label for="edit-reply-image">Attach / Replace Image (Optional)</label>
<input type="file" id="edit-reply-image" name="reply_image" accept="image/*">
</div>
<span id="form-error" style="color: red; display: none; font-size: 0.9em; margin-bottom: 10px;"></span>
<div class="flex-between">
<a href="thread-detail.html" class="btn btn-secondary">Cancel</a>
<button type="submit" class="btn btn-primary">Save Reply Changes</button>
</div>
</form>
</div>
</main>
<footer>
<p>&copy; 2026 Rshop Marketplace</p>
</footer>
<script src="../components/shared-nav.js"></script>
<script src="js/discussion_forum.js?=v2"></script>
</body>
</html>
