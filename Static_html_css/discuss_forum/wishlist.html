<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and manage the custom requests and products you have saved.">
    <title>My Wishlist - Custom Makers Marketplace</title>
    <link rel="stylesheet" href="../css/module-base.css">
    <link rel="stylesheet" href="css/wishlist.css">
    <link rel="stylesheet" href="../css/top-nav.css">
</head>
<body class="with-rshop-nav">
  <div id="rshop-shared-nav"></div>

    

    <main class="container-md">
        <div class="card mb-2">
            <h1>My Saved Wishlist Items</h1>
            <p class="meta-info">View and manage the custom requests and products you are interested in.</p>
        </div>

        <div class="wishlist-list" id="wishlistList"></div>
    </main>

    <footer>
      <p>&copy; 2026 Rshop Marketplace</p>
    </footer>

    <script>
      function normalizeSavedWishlistItems(items) {
        if (!Array.isArray(items)) return [];
        return items
          .map((item) => {
            if (typeof item === 'string') {
              return {
                threadId: item,
                title: item,
                description: 'Saved from the marketplace.',
                price: 0,
                statusLabel: 'Open',
                image: '../images/ergonomic_wooden_desk.png'
              };
            }

            return {
              threadId: item.threadId || item.id || '',
              title: item.title || 'Saved item',
              description: item.description || 'Saved from the marketplace.',
              price: Number(item.price || 0),
              statusLabel: item.statusLabel || 'Open',
              image: item.image || '../images/ergonomic_wooden_desk.png'
            };
          })
          .filter(item => item.threadId);
      }

      function getSavedWishlistItems() {
        try {
          const items = JSON.parse(localStorage.getItem('savedMarketThreads') || '[]');
          const normalized = normalizeSavedWishlistItems(items);
          localStorage.setItem('savedMarketThreads', JSON.stringify(normalized));
          return normalized;
        } catch (error) {
          console.error('Error reading wishlist items:', error);
          return [];
        }
      }

      function renderWishlist() {
        const container = document.getElementById('wishlistList');
        const items = getSavedWishlistItems();

        if (!items.length) {
          container.innerHTML = '<article class="card wishlist-item"><div class="wishlist-content"><p class="meta-info">No saved items yet. Save a request from the market to see it here.</p></div></article>';
          return;
        }

        container.innerHTML = items.map(item => `
          <article class="card wishlist-item">
            <img class="wishlist-img" src="${item.image || '../images/ergonomic_wooden_desk.png'}" alt="${item.title || 'Saved wishlist item'}">

            <div class="wishlist-content">
              <a href="thread-detail.html?threadId=${item.threadId}" class="card-title">${item.title}</a>
              <p class="mt-1 mb-1">${item.description || 'Saved from the marketplace.'}</p>
              <div class="meta-info">
                <strong>Wishlist Stats:</strong><br>
                • Price: $${Number(item.price || 0).toFixed(2)}<br>
                • Status: ${item.statusLabel || 'Open'}
              </div>
            </div>

            <div class="wishlist-actions">
              <button class="btn btn-primary btn-sm" onclick="moveItemToCart('${item.title.replace(/'/g, "\\'")}', '${item.threadId}', ${Number(item.price || 0)})">Move to Cart</button>
              <button class="btn btn-danger btn-sm" onclick="removeWishlistItem('${item.threadId}')">Remove</button>
            </div>
          </article>
        `).join('');
      }

      function moveItemToCart(title, threadId, price) {
        try {
          let forumCart = JSON.parse(localStorage.getItem('forumCart') || '[]');

          const cartItem = {
            id: threadId,
            title: title,
            threadId: threadId,
            price: Number(price) || 0,
            status: 'Accepted Offer',
            movedAt: new Date().toISOString()
          };

          const existingIndex = forumCart.findIndex(item => (item.threadId || item.id) === threadId);
          if (existingIndex >= 0) {
            if (confirm(`"${title}" is already in your cart. Do you want to update it?`)) {
              forumCart[existingIndex] = cartItem;
            } else {
              return;
            }
          } else {
            forumCart.push(cartItem);
          }

          localStorage.setItem('forumCart', JSON.stringify(forumCart));
          alert(`✓ "${title}" has been added to your cart.\n\nRedirecting to cart...`);

          setTimeout(() => {
            window.location.href = '../shopping_cart/cart.html';
          }, 500);
        } catch (error) {
          console.error('Error adding to cart:', error);
          alert('Error adding item to cart. Please try again.');
        }
      }

      function removeWishlistItem(threadId) {
        try {
          const items = getSavedWishlistItems().filter(item => item.threadId !== threadId);
          localStorage.setItem('savedMarketThreads', JSON.stringify(items));
          renderWishlist();
        } catch (error) {
          console.error('Error removing wishlist item:', error);
          alert('Error removing item from wishlist.');
        }
      }

      document.addEventListener('DOMContentLoaded', renderWishlist);
    </script>
  <script src="../components/shared-nav.js"></script>
</body>
</html>
