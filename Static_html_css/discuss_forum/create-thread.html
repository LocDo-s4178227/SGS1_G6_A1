<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create a new forum post with author and timestamp details.">
<title>Create Thread - Custom Makers Marketplace</title>
<link rel="stylesheet" href="../css/module-base.css">
<link rel="stylesheet" href="css/discussion_forum.css">
<link rel="stylesheet" href="../css/top-nav.css">
</head>
<body class="with-rshop-nav">
<div id="rshop-shared-nav"></div>
<main class="container-sm">
<div class="card">
<h1>Create Your Post</h1>
<form id="create-thread-form" class="mt-1">
<div class="form-group current-user-info" style="margin-bottom: 15px; padding: 10px; background-color: #e9ecef; border-left: 4px solid #007bff; border-radius: 4px;">
<span style="font-size: 0.9em; color: #555;">Posting as: </span>
<strong id="currentUserDisplay" style="color: #333;">Loading user...</strong>
<br>
<small style="color: #666; font-style: italic;">* Date and time will be automatically generated by the server.</small>
</div>
<div class="form-group">
<label for="edit-title">Post Title</label>
<input type="text" id="edit-title" name="title" required>
<span id="edit-title-error" style="color: red; display: none; font-size: 0.85em; margin-top: 5px;"></span>
</div>
<div class="form-group">
<label for="edit-content">Description &amp; Requirements</label>
<textarea id="edit-content" name="content" rows="6" required></textarea>
<span id="edit-content-error" style="color: red; display: none; font-size: 0.85em; margin-top: 5px;"></span>
</div>
<div class="form-group">
<label for="edit-image">Reference Image</label>
<img class="current-image-preview" alt="Please add in an image for your ">
</div>
<div class="form-group">
<input type="file" id="edit-image" name="image" accept="image/*">
<small class="form-text text-muted">Note: image upload is not yet stored by the API — this field is a placeholder until file upload is added.</small>
</div>
<span id="form-error" style="color: red; display: none; font-size: 0.9em; margin-bottom: 10px;"></span>
<div class="flex-between">
<a href="forum.html" class="btn btn-secondary">Cancel</a>
<button type="submit" class="btn btn-primary">Create Thread</button>
</div>
</form>
</div>
</main>
<footer>
<p>&copy; 2026 Rshop Marketplace</p>
</footer>
<script src="../components/shared-nav.js"></script>
<script src="js/discussion_forum.js?=v2"></script>
</body>
</html>
