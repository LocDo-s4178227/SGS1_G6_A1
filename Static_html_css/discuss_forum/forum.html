<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Browse open custom-make requests posted by the community.">
<title>Request Board - Custom Makers Marketplace</title>
<link rel="stylesheet" href="../css/module-base.css">
<link rel="stylesheet" href="css/discussion_forum.css">
<link rel="stylesheet" href="../css/top-nav.css">
</head>
<body class="with-rshop-nav">
  <div id="rshop-shared-nav"></div>

    <main class="container">
        <div class="page-header">
            <h1>Custom Makers Request Board</h1>
            <p>Browse open requests from the community and offer your craftsmanship.</p>
        </div>
        <div class="forum-layout">
            <aside id="forum-filters">
                <h3>Filter &amp; Sort</h3>
                <form action="forum.html" method="GET">
                    <div class="form-group">
                        <label for="search-title">Filter by Thread Title</label>
                        <input type="text" id="search-title" name="title" placeholder="e.g., wooden desk, keyboard...">
                    </div>
                    <div class="form-group">
                        <label for="search-content">Filter by Post Content</label>
                        <input type="text" id="search-content" name="content" placeholder="e.g., oak, resin printer, budget...">
                    </div>
                    <div class="form-group">
                        <label for="sort-by">Sort By</label>
                        <select id="sort-by" name="sort">
                            <option value="newest">Date: Most Recent Post First</option>
                            <option value="oldest">Date: Oldest Post First</option>
                            <option value="title_asc">Title: A-Z</option>
                            <option value="title_desc">Title: Z-A</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Apply Filters</button>
                </form>
            </aside>
            <!--
                NOTE: thread cards below are no longer hardcoded.
                They are rendered dynamically by initForumBoard() in js/discussion_forum.js
                using data fetched live from GET /api/threads.
            -->
            <section class="thread-list" aria-label="Open requests">
                <p class="loading-state" style="text-align:center; color:#666; padding: 20px 0;">Loading requests…</p>
            </section>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Rshop Marketplace</p>
    </footer>
    <script>
      function normalizeSavedWishlist(items) {
        if (!Array.isArray(items)) return [];
        return items
          .map((item) => {
            if (typeof item === 'string') {
              return {
                threadId: item,
                title: item,
                description: 'Saved from the forum board.',
                price: 0,
                statusLabel: 'Open',
                image: '../images/ergonomic_wooden_desk.png'
              };
            }
            return {
              threadId: item.threadId || item.id || '',
              title: item.title || 'Saved item',
              description: item.description || 'Saved from the forum board.',
              price: Number(item.price || 0),
              statusLabel: item.statusLabel || 'Open',
              image: item.image || '../images/ergonomic_wooden_desk.png'
            };
          })
          .filter(item => item.threadId);
      }
      function getSavedWishlist() {
        try {
          const saved = JSON.parse(localStorage.getItem('savedMarketThreads') || '[]');
          const normalized = normalizeSavedWishlist(saved);
          localStorage.setItem('savedMarketThreads', JSON.stringify(normalized));
          return normalized;
        } catch (error) {
          console.error('Error reading wishlist:', error);
          return [];
        }
      }
      function saveThreadToWishlist(threadId, title, image, statusLabel) {
        const saved = getSavedWishlist();
        const exists = saved.some(item => item.threadId === threadId);
        if (!exists) {
          saved.push({
            threadId,
            title,
            image,
            description: `${title} request from the forum board.`,
            price: 0,
            statusLabel
          });
          localStorage.setItem('savedMarketThreads', JSON.stringify(saved));
        }
        alert(`Saved "${title}" to wishlist`);
      }
    </script>
  <script src="../components/shared-nav.js"></script>
  <script src="js/discussion_forum.js?=v3"></script>
</body>
</html>
