<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View request details, replies, and offers, or agree a price with a maker.">
    <title>Request Details - Custom Makers Marketplace</title>
    <link rel="stylesheet" href="../css/module-base.css">
    <link rel="stylesheet" href="css/discussion_forum.css">
    <link rel="stylesheet" href="../css/top-nav.css">
</head>
<body class="with-rshop-nav">
  <div id="rshop-shared-nav"></div>

    

    <main class="container-md" id="threadDetailRoot"></main>

    <footer>
        <p>&copy; 2026 Rshop Marketplace</p>
    </footer>

    <script>
      const THREAD_DETAILS = {
        'desk-001': {
          title: 'Need a custom ergonomic wooden desk',
          author: 'Alex',
          postedAt: 'Oct 25, 2026 at 10:30 AM',
          description: "I'm looking for a carpenter or design student who can build an L-shaped wooden desk for my home office. I need it to be exactly 160cm x 120cm to fit my corner space. Solid wood preferred, open to material suggestions like oak or walnut. Budget is around $400.",
          image: '../images/ergonomic_wooden_desk.png',
          alt: 'Reference sketch of the requested corner desk',
          maker: 'MakerJohn',
          price: 420,
          replyTitle: 'Re: Can build this in solid oak',
          replyBody: "Hi Alex, I'm an industrial design student and have access to the workshop. I can definitely build this using solid oak. Would you be open to a digital 3D mockup first?",
          replyDate: 'Oct 25, 2026 at 11:15 AM'
        },
        'keyboard-002': {
          title: '3D Printed Mechanical Keyboard Case',
          author: 'Sam',
          postedAt: 'Nov 4, 2026 at 9:15 AM',
          description: "I need a matte black mechanical keyboard case for a 60% hot-swap PCB. I want a clean tray-mount fit and a lightweight shell that still feels premium. Budget is around $180.",
          image: '../images/mechanical_keyboard_case.png',
          alt: 'Reference render of the requested keyboard case',
          maker: 'MakerRae',
          price: 180,
          replyTitle: 'Re: Black resin prototype with tray mount',
          replyBody: "Hi Sam, I can print a low-profile 60% case in matte black resin and tune the plate clearance for your PCB. I can provide a small test fit before final finishing.",
          replyDate: 'Nov 4, 2026 at 10:05 AM'
        }
      };

      function getCurrentThreadId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('threadId') || 'desk-001';
      }

      function normalizeSavedThreads(items) {
        if (!Array.isArray(items)) return [];
        return items
          .map((item) => {
            if (typeof item === 'string') {
              return {
                threadId: item,
                title: item,
                description: 'Saved from the forum board.',
                price: 0,
                statusLabel: 'Open',
                image: '../images/ergonomic_wooden_desk.png'
              };
            }

            return {
              threadId: item.threadId || item.id || '',
              title: item.title || 'Saved item',
              description: item.description || 'Saved from the marketplace.',
              price: Number(item.price || 0),
              statusLabel: item.statusLabel || 'Open',
              image: item.image || '../images/ergonomic_wooden_desk.png'
            };
          })
          .filter(item => item.threadId);
      }

      function getSavedThreads() {
        try {
          const saved = JSON.parse(localStorage.getItem('savedMarketThreads') || '[]');
          const normalized = normalizeSavedThreads(saved);
          localStorage.setItem('savedMarketThreads', JSON.stringify(normalized));
          return normalized;
        } catch (error) {
          console.error('Error reading wishlist:', error);
          return [];
        }
      }

      function saveCurrentThreadToWishlist() {
        const threadId = getCurrentThreadId();
        const thread = THREAD_DETAILS[threadId];
        if (!thread) return;

        const saved = getSavedThreads();
        if (!saved.some(item => item.threadId === threadId)) {
          saved.push({
            threadId,
            title: thread.title,
            image: thread.image,
            description: thread.description,
            price: Number(thread.price) || 0,
            statusLabel: 'Open'
          });
          localStorage.setItem('savedMarketThreads', JSON.stringify(saved));
        }

        alert(`Saved "${thread.title}" to wishlist`);
      }

      function agreePriceAndAddToCart(itemTitle, makerName, price, threadId) {
        try {
          const cart = JSON.parse(localStorage.getItem('forumCart') || '[]');
          const cartItem = {
            id: threadId,
            title: itemTitle,
            maker: makerName,
            price: Number(price) || 0,
            threadId,
            agreedAt: new Date().toISOString(),
            status: 'Accepted Offer'
          };

          const existingIndex = cart.findIndex(item => (item.threadId || item.id) === threadId);
          if (existingIndex >= 0) {
            if (confirm(`"${itemTitle}" is already in your cart. Do you want to update it?`)) {
              cart[existingIndex] = cartItem;
            } else {
              return;
            }
          } else {
            cart.push(cartItem);
          }

          localStorage.setItem('forumCart', JSON.stringify(cart));
          alert(`✓ "${itemTitle}" has been added to your cart at $${Number(price).toFixed(2)}\n\nRedirecting to cart...`);

          setTimeout(() => {
            window.location.href = '../shopping_cart/cart.html';
          }, 500);
        } catch (error) {
          console.error('Error adding to cart:', error);
          alert('Error adding item to cart. Please try again.');
        }
      }

      function renderThreadDetail() {
        const threadId = getCurrentThreadId();
        const thread = THREAD_DETAILS[threadId] || THREAD_DETAILS['desk-001'];
        const root = document.getElementById('threadDetailRoot');

        root.innerHTML = `
          <article class="card">
            <div class="flex-between mb-1">
              <h1>${thread.title}</h1>
              <div>
                <button class="btn btn-secondary btn-sm" onclick="saveCurrentThreadToWishlist()">Save to Wishlist</button>
                <a href="edit-post.html" class="btn btn-secondary btn-sm">Edit Request</a>
                <form action="forum.html" method="POST" class="inline-form">
                  <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this post?')">Delete</button>
                </form>
              </div>
            </div>

            <div class="meta-info mb-1">
              Posted by: <strong>${thread.author}</strong> | ${thread.postedAt}
            </div>

            <div class="post-content">
              <p>${thread.description}</p>
              <img class="post-image" src="${thread.image}" alt="${thread.alt}">
            </div>
          </article>

          <section class="reply-section">
            <h2 class="mb-1">Offers &amp; Replies (1)</h2>

            <article class="card reply-card">
              <div class="flex-between mb-1">
                <h3 class="reply-title">${thread.replyTitle}</h3>
                <div>
                  <a href="edit-reply.html" class="btn btn-secondary btn-sm">Edit Reply</a>
                  <form action="thread-detail.html" method="POST" class="inline-form">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this reply?')">Delete</button>
                  </form>
                </div>
              </div>
              <div class="meta-info mb-1">Reply from: <strong>${thread.maker}</strong> | ${thread.replyDate}</div>
              <div class="post-content">
                <p>${thread.replyBody}</p>
              </div>

              <div class="offer-section">
                <div>
                  <span class="meta-info">Proposed Price:</span>
                  <div class="offer-price">$${Number(thread.price).toFixed(2)}</div>
                </div>
                <button class="btn btn-success" onclick="agreePriceAndAddToCart('${thread.title}', '${thread.maker}', ${Number(thread.price)}, '${threadId}')">Agree Price</button>
              </div>
            </article>

            <div class="card mt-2" id="reply-form">
              <h3>Post a Reply / Make an Offer</h3>
              <form action="thread-detail.html" method="POST" class="mt-1">
                <div class="form-group">
                  <label for="reply-title">Reply Title</label>
                  <input type="text" id="reply-title" name="reply_title" required placeholder="e.g., Re: Timeline and material options">
                </div>
                <div class="form-group">
                  <label for="reply-content">Your Reply</label>
                  <textarea id="reply-content" name="reply_content" rows="4" required placeholder="Type your reply, questions, or offer here..."></textarea>
                </div>
                <div class="form-group">
                  <label for="reply-author">Your Name</label>
                  <input type="text" id="reply-author" name="reply_author" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                  <label for="reply-timestamp">Reply Date &amp; Time</label>
                  <input type="datetime-local" id="reply-timestamp" name="reply_timestamp" required>
                </div>
                <div class="form-group">
                  <label for="reply-image">Attach Image (Optional)</label>
                  <input type="file" id="reply-image" name="reply_image" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary">Submit Reply</button>
              </form>
            </div>
          </section>
        `;
      }

      document.addEventListener('DOMContentLoaded', renderThreadDetail);
    </script>
  <script src="../components/shared-nav.js"></script>
</body>
</html>
