<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Review items moved from wishlist before checkout." />
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="../css/shopping_module_style.css" />
  <link rel="stylesheet" href="../css/cart.css" />
    <link rel="stylesheet" href="../css/top-nav.css">
</head>
<body class="with-rshop-nav">
  <div id="rshop-shared-nav"></div>

  

  <main class="container">
    <section class="page-header">
      <h1>Cart</h1>
      <p>These are items you added to your cart for final purchase confirmation.</p>
    </section>

    <div style="display:grid; grid-template-columns:1fr 340px; gap:28px; margin-bottom:var(--spacing-xl);">
      <section style="overflow-x:auto;">
        <table class="cart-table">
          <thead>
            <tr>
              <th>Item</th>
              <th>Source Thread</th>
              <th>Agreed Price</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="cartTableBody">
            <!-- Dynamically populated from localStorage -->
          </tbody>
        </table>

        <div style="margin-top:var(--spacing-lg); text-align:center;">
          <a href="../discuss_forum/wishlist.html" class="btn btn-secondary">Back to Wishlist</a>
        </div>
      </section>

      <aside class="cart-summary">
        <h3 style="margin-bottom:var(--spacing-lg);">Order Summary</h3>
        <div class="summary-row"><span id="subtotalLabel">Subtotal (0 items)</span><span id="subtotalValue">$0.00</span></div>
        <div class="summary-row"><span>Service Fee</span><span id="serviceFee">$0.00</span></div>
        <div class="summary-row"><span>Tax (10%)</span><span id="taxValue">$0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="totalValue">$0.00</span></div>

        <a href="checkout.html" class="btn btn-primary" style="display:block; text-align:center; margin-top:var(--spacing-md);">
          Proceed to Checkout
        </a>
      </aside>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Rshop Marketplace</p>
  </footer>
  
  <script src="js/main.js"></script>
  <script>
    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function loadCartItems() {
      const tbody = document.getElementById('cartTableBody');
      try {
        const cart = await apiCall(`/cart/${SESSION_ID}`);
        const items = cart.items || [];

        if (!items.length) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#666;">Your cart is empty.</td></tr>';
          updateOrderSummary([]);
          return;
        }

        tbody.innerHTML = items.map(item => {
          const details = item.textDetails || {};
          const title = details.title || item.productId;
          const threadId = details.threadId || item.productId;
          const totalPrice = Number(item.unitPrice || 0) * Number(item.quantity || 0);
          return `
            <tr>
              <td><strong>${escapeHtml(title)}</strong>${item.quantity > 1 ? ` <span>(${item.quantity})</span>` : ''}</td>
              <td><a href="../discuss_forum/thread-detail.html?threadId=${encodeURIComponent(threadId)}">${escapeHtml(threadId)}</a></td>
              <td>$${totalPrice.toFixed(2)}</td>
              <td>${escapeHtml(details.status || 'Accepted Offer')}</td>
              <td><button class="btn btn-link btn-small" onclick="removeItemFromCart('${item.id}')">Remove</button></td>
            </tr>
          `;
        }).join('');

        updateOrderSummary(items);
      } catch (error) {
        console.error('Error loading cart items:', error);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#666;">Could not load your cart: ${escapeHtml(error.message)}</td></tr>`;
        updateOrderSummary([]);
      }
    }

    function updateOrderSummary(items) {
      const subtotal = items.reduce((sum, item) => sum + (Number(item.unitPrice) || 0) * (Number(item.quantity) || 0), 0);
      const serviceFee = Math.max(items.length * 10, 0);
      const tax = (subtotal + serviceFee) * 0.10;
      const total = subtotal + serviceFee + tax;

      const itemCount = items.reduce((total, item) => total + (Number(item.quantity) || 0), 0);
      document.getElementById('subtotalLabel').textContent = `Subtotal (${itemCount} item${itemCount !== 1 ? 's' : ''})`;
      document.getElementById('subtotalValue').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('serviceFee').textContent = `$${serviceFee.toFixed(2)}`;
      document.getElementById('taxValue').textContent = `$${tax.toFixed(2)}`;
      document.getElementById('totalValue').textContent = `$${total.toFixed(2)}`;
    }

    async function removeItemFromCart(itemId) {
      if (!itemId) return;
      if (confirm('Remove this item from cart?')) {
        try {
          await apiCall(`/cart/${SESSION_ID}/items/${itemId}`, { method: 'DELETE' });
          await updateCartBadge();
          await loadCartItems();
        } catch (error) {
          console.error('Error removing item:', error);
          alert(`Could not remove this item: ${error.message}`);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', loadCartItems);

    function highlightActiveLink() {
      const currentPage = window.location.pathname.split('/').pop() || 'index.html';
      const navLinks = document.querySelectorAll('nav a');

      if (currentPage === 'cart.html' || currentPage === 'review.html') {
        navLinks.forEach(link => link.classList.remove('active'));
        return;
      }

      navLinks.forEach(link => {
        const linkPage = link.getAttribute('href').split('/').pop();
        if (linkPage === currentPage) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', highlightActiveLink);
  </script>
  <script src="../components/shared-nav.js"></script>
</body>
</html>
